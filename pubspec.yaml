name: hermes_android
description: "Hermes Agent — chat with your Hermes Gateway API Server over LAN. SSE streaming, Bearer auth, session management."
publish_to: 'none'
version: 1.1.0+2111

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  flutter_markdown: ^0.7.6

  # Network
  http: ^1.2.0

  # Local storage
  shared_preferences: ^2.3.0
  path_provider: ^2.1.5

  # Data models
  uuid: ^4.5.1

  # Misc
  package_info_plus: ^10.2.1

  speech_to_text: ^7.4.0

  # Removed as unused (nothing in lib/ or test/ imported them):
  #   flutter_riverpod, go_router, json_annotation, url_launcher, highlight.
  # State is plain StatefulWidget, navigation is bare Navigator/MaterialPageRoute,
  # models are hand-written fromJson, and flutter_markdown does its own
  # highlighting.
  #
  # google_fonts was also removed: the one face it supplied (Cinzel, for the
  # wordmark) is now bundled under assets/fonts, so there is no runtime font
  # fetch and no offline fallback to the wrong face. See core/utils/brand.dart.

  # TTS via XTTS-v2 server (returns WAV bytes we play locally)
  audioplayers: ^6.1.0

  # Inline video playback for generated clips (ComfyUI /view). media_kit is
  # libmp/FFmpeg-based: it software-decodes codecs Android's hardware decoders
  # reject (HEVC/H.265, VP9, AV1, 10-bit yuv420p10le, mkv/webm), which the old
  # video_player (hardware-first ExoPlayer, no software fallback) failed on —
  # ComfyUI/WAN outputs regularly hit those formats.
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5
  flutter_foreground_task: ^10.0.0

  # User-side image attach (gallery picker) for multimodal chat messages
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  json_serializable: ^6.9.4

flutter:
  uses-material-design: true
  assets:
    - assets/
  fonts:
    # Bundled rather than fetched at runtime by google_fonts, which hit
    # fonts.gstatic.com during the first frame and fell back to the default
    # face when that failed — so the brand wordmark was wrong on any device
    # without internet access, which for a LAN-only gateway app is normal.
    # Only the 700 weight is shipped because that is the only one used.
    # SIL Open Font License, see assets/fonts/OFL.txt.
    - family: Cinzel
      fonts:
        - asset: assets/fonts/Cinzel-Bold.ttf
          weight: 700
