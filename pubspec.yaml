name: hermes_android
description: "Hermes Agent — chat with your Hermes Gateway API Server over LAN. SSE streaming, Bearer auth, session management."
publish_to: 'none'
version: 1.1.0+2111

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  flutter_markdown: ^0.7.6
  google_fonts: ^6.2.1

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.0.0

  # Network
  http: ^1.2.0

  # Local storage
  shared_preferences: ^2.3.0
  path_provider: ^2.1.5

  # Data models
  json_annotation: ^4.9.0
  uuid: ^4.5.1

  # Misc
  url_launcher: ^6.3.0
  package_info_plus: ^8.0.0

  # Markdown syntax highlighting
  highlight: ^0.7.0
  speech_to_text: ^7.4.0

  # TTS via XTTS-v2 server (returns WAV bytes we play locally)
  audioplayers: ^6.1.0

  # Inline video playback for generated clips (ComfyUI /view). media_kit is
  # libmp/FFmpeg-based: it software-decodes codecs Android's hardware decoders
  # reject (HEVC/H.265, VP9, AV1, 10-bit yuv420p10le, mkv/webm), which the old
  # video_player (hardware-first ExoPlayer, no software fallback) failed on —
  # ComfyUI/WAN outputs regularly hit those formats.
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5
  flutter_foreground_task: ^10.0.0

  # User-side image attach (gallery picker) for multimodal chat messages
  image_picker: ^1.1.2

  # Push notifications (FCM) so a reply can reach the phone without the app
  # staying open. Requires android/app/google-services.json from a Firebase
  # project (not included) before Firebase.initializeApp() will succeed at
  # runtime — see PushService.
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  json_serializable: ^6.9.4

flutter:
  uses-material-design: true
  assets:
    - assets/
